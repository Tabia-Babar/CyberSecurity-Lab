{% extends "base.html" %}{% block content %}
<h3>Add User</h3>
<form method="post" class="card p-3 col-md-6"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
 <input class="form-control mb-2" name="name" placeholder="Full name" required>
 <input class="form-control mb-2" type="email" name="email" placeholder="Email" required>
 <select class="form-select mb-2" name="role">{% for k, v in roles.items() %}<option value="{{ k }}">{{ v }}</option>{% endfor %}</select>
 <input class="form-control mb-2" name="designation" placeholder="Designation (officers only, e.g. Inspector)">
 <input class="form-control mb-2" name="department" placeholder="Department (officers only)">
 <input class="form-control mb-2" name="contact" placeholder="Contact (officers only)">
 <input class="form-control mb-3" type="password" name="password" minlength="8" placeholder="Password (min 8)" required>
 <button class="btn btn-primary">Create</button></form>{% endblock %}
